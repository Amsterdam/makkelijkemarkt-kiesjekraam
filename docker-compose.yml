version: "3"
services:
  kiesjekraam:
    image: ${REGISTRY:-127.0.0.1:5001}/${REPOSITORY:-ams-mrkt/kiesjekraam}:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: kiesjekraam
    command: "npm run dev"
    ports:
      - "127.0.0.1:8093:8080"
